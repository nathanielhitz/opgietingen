name: Scrape opgiet-events

on:
  schedule:
    - cron: "0 6 * * 1"   # elke maandag 06:00 UTC (± 07:00/08:00 NL-tijd)
  workflow_dispatch:
    inputs:
      limit:
        description: "Max. aantal bronnen (leeg = alle actieve bronnen)"
        required: false
        default: ""

permissions:
  contents: write
  issues: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Starttijd van de run = sleutel van het run-record (data/scrape-runs.json).
      - name: Leg starttijd vast
        run: echo "RUN_GESTART=$(date -u +%FT%TZ)" >> "$GITHUB_ENV"

      # Stap 1 — verifieer bronnen (robots, redirects, agendapagina-discovery,
      # Firecrawl-fallback voor JS-gerenderde pagina's). Werkt bronnen.json bij;
      # kapotte/gewijzigde bronnen worden gemeld via het scraper-issue.
      - name: Verifieer bronnen
        run: npm run verify-bronnen -- --all
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}

      # Stap 2 — scrape alleen de actieve bronnen.
      - name: Scrape events (poort → gepubliceerd/concept in content/events/)
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SCRAPE_AUTOPUBLISH: "true"
          LIMIT: ${{ github.event.inputs.limit }}
        run: |
          if [ -n "$LIMIT" ]; then
            npm run scrape -- --limit "$LIMIT"
          else
            npm run scrape
          fi

      # Stap 3 — haal Facebook-postaankondigingen op (gratis, via gallery-dl,
      # geen login) voor bronnen met een facebook-veld en verwerk ze door
      # dezelfde extractie/poort/dedup-keten als de website-scraper.
      - name: Setup gallery-dl
        continue-on-error: true
        run: pip install gallery-dl

      - name: Scrape Facebook-pagina's (poort → gepubliceerd/concept in content/events/)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SCRAPE_AUTOPUBLISH: "true"
        run: npm run scrape-facebook

      # Stap 4 — verwerk nieuwsbrieven uit de gedeelde inbox (events@opgietingen.nl).
      # Slaat zichzelf over als de IMAP-secrets nog niet gezet zijn.
      - name: Scrape nieuwsbrieven (IMAP → poort → concept/gepubliceerd)
        env:
          MAIL_IMAP_HOST: ${{ secrets.MAIL_IMAP_HOST }}
          MAIL_IMAP_PORT: ${{ secrets.MAIL_IMAP_PORT }}
          MAIL_IMAP_USER: ${{ secrets.MAIL_IMAP_USER }}
          MAIL_IMAP_PASS: ${{ secrets.MAIL_IMAP_PASS }}
          MAIL_IMAP_TLS: ${{ secrets.MAIL_IMAP_TLS }}
          MAIL_VERTROUWDE_AFZENDERS: ${{ secrets.MAIL_VERTROUWDE_AFZENDERS }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SCRAPE_AUTOPUBLISH: "true"
        run: npm run scrape-mail

      # Stap 5 — hercontroleer verouderde opgietroosters (> 60 dagen niet
      # bevestigd) tegen de sauna-website; bevestigde roosters krijgen een
      # verse roosterGecheckt-datum, afwijkingen komen in het scraper-issue.
      - name: Hercheck opgietroosters
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run check-roosters

      # Vouw de metrics van verify-bronnen en de drie scrapers tot één
      # run-record voor /beheer. Altijd, ook na een gefaalde stap: een run die
      # niets opleverde is óók een datapunt.
      - name: Bouw run-record
        id: runrecord
        if: always()
        env:
          SCRAPE_AUTOPUBLISH: "true"
        run: npm run run-record

      # Het run-record verandert elke week, dus er is nu elke run een commit — bewust.
      - name: Commit resultaten op main
        id: commit
        # Ook committen wanneer een eerdere stap faalde: geschreven events en
        # bijgewerkte bronnen/roosters mogen niet verloren gaan met de runner.
        if: always()
        env:
          SAMENVATTING: ${{ steps.runrecord.outputs.samenvatting || 'geen samenvatting' }}
        run: |
          git config user.name "opgietingen-bot"
          git config user.email "bot@opgietingen.nl"
          git add content/events content/bronnen.json content/saunas
          if [ -f data/scrape-runs.json ]; then git add data/scrape-runs.json; fi
          if git diff --cached --quiet; then
            echo "Geen wijzigingen om te committen."
            echo "gecommit=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(scraper): run $(date -u +%d-%m) — $SAMENVATTING"
            git push origin HEAD:main
            echo "gecommit=true" >> "$GITHUB_OUTPUT"
          fi

      # Meld de zojuist gepubliceerde URL's aan bij IndexNow (Bing c.s.).
      # Alleen na een échte commit: zonder wijziging zou HEAD~1 de vorige run
      # opnieuw inleveren. Google doet niet mee aan IndexNow — daar blijft
      # sitemap.xml het kanaal. Mislukt dit, dan is dat geen reden de run
      # te laten falen.
      - name: Meld nieuwe URL's aan bij IndexNow
        if: always() && steps.commit.outputs.gecommit == 'true'
        continue-on-error: true
        run: npm run indexnow

      # Ook na een gefaalde stap: het weekissue is juist dan de melding. Een
      # gefaald rapport telt als "niet schoon" zodat het issue nooit onterecht sluit.
      - name: Bouw probleemrapport
        id: report
        if: ${{ !cancelled() }}
        run: |
          if STATUS=$(npm run --silent scrape-report); then
            echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          else
            echo "status=rapport-mislukt" >> "$GITHUB_OUTPUT"
          fi

      - name: Beheer scraper-issue
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATUS: ${{ steps.report.outputs.status }}
        run: |
          gh label create scraper-probleem --color B60205 --description "Scraper heeft aandacht nodig" || true
          EXISTING=$(gh issue list --label scraper-probleem --state open --json number --jq '.[0].number')
          if [ "$STATUS" != "schoon" ]; then
            if [ ! -f scrape-issue.md ]; then
              printf '## Rapport kon niet worden gebouwd\n\nZie de workflow-logs van run %s.\n' "$GITHUB_RUN_ID" > scrape-issue.md
            fi
            if [ -n "$EXISTING" ]; then
              gh issue edit "$EXISTING" --body-file scrape-issue.md
              gh issue comment "$EXISTING" --body "Rapport bijgewerkt door de wekelijkse run."
            else
              gh issue create --title "Scraper: aandachtspunten" \
                --label scraper-probleem --body-file scrape-issue.md
            fi
          else
            if [ -n "$EXISTING" ]; then
              gh issue close "$EXISTING" --comment "Schone run — geen aandachtspunten meer."
            fi
          fi
