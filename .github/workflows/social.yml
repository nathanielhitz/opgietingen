name: Social-posts inplannen in Buffer

on:
  schedule:
    - cron: "30 7 * * 1"   # elke maandag 07:30 UTC, anderhalf uur na de scrape (06:00 UTC)
  workflow_dispatch:
    inputs:
      datum:
        description: "Referentiedatum YYYY-MM-DD, een maandag (leeg = maandag van de huidige week, NL-tijd)"
        required: false
        default: ""
      modus:
        description: "inplannen | concept | dry-run"
        required: false
        default: "inplannen"
        type: choice
        options:
          - inplannen
          - concept
          - dry-run

permissions:
  contents: write

concurrency:
  group: push-naar-main
  cancel-in-progress: false

jobs:
  social:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Checkout op de branch-tip, niet op GITHUB_SHA: bij een Re-run of een run
      # die in de concurrency-rij wachtte is GITHUB_SHA een commit van vóór de
      # laatste grootboek-commit, en dan zou het script geslaagde posts opnieuw aanmaken.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      # De versheidscheck vergelijkt de planning met deze commit (niet met GITHUB_SHA).
      - name: Leg runner-commit vast
        run: echo "RUNNER_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # De slideshow-video's worden op de runner gerenderd; ffmpeg staat niet op
      # het ubuntu-latest-image. Faalt dit, dan vallen de posts terug op foto.
      - name: Installeer ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg

      # Leest /social/planning van de live site (wacht tot de deploy van deze
      # commit live is), rendert per post een slideshow-video (ffmpeg → Vercel
      # Blob) en maakt per kanaal een ingeplande Buffer-post. Zonder
      # BUFFER_API_KEY slaat het script zichzelf over; zonder BLOB_READ_WRITE_TOKEN
      # gaan de posts als fotocarrousel (waarschuwing, exitcode 1).
      - name: Plan social-posts in Buffer
        id: buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_KANAAL_FACEBOOK: ${{ secrets.BUFFER_KANAAL_FACEBOOK }}
          BUFFER_KANAAL_INSTAGRAM: ${{ secrets.BUFFER_KANAAL_INSTAGRAM }}
          BUFFER_KANAAL_TIKTOK: ${{ secrets.BUFFER_KANAAL_TIKTOK }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          DATUM: ${{ github.event.inputs.datum }}
          MODUS: ${{ github.event.inputs.modus || 'inplannen' }}
        run: |
          ARGS=""
          if [ -n "$DATUM" ]; then ARGS="$ARGS --datum $DATUM"; fi
          case "$MODUS" in
            inplannen) ;;
            concept) ARGS="$ARGS --concept" ;;
            dry-run) ARGS="$ARGS --dry-run" ;;
            *) echo "Onbekende modus: $MODUS"; exit 1 ;;
          esac
          npm run social-buffer -- $ARGS

      # Het grootboek is het geheugen tegen dubbele posts. Ook committen als het
      # script faalde: al geplaatste posts mogen niet verloren gaan met de runner.
      - name: Commit grootboek op main
        if: always() && github.ref == 'refs/heads/main' && (github.event.inputs.modus || 'inplannen') == 'inplannen'
        env:
          INGEPLAND: ${{ steps.buffer.outputs.ingepland || '0' }}
          DATUM: ${{ github.event.inputs.datum }}
        run: |
          git config user.name "opgietingen-bot"
          git config user.email "bot@opgietingen.nl"
          if [ -f data/social-buffer.json ]; then git add data/social-buffer.json; fi
          if git diff --cached --quiet; then
            echo "Geen wijzigingen in het grootboek."
          else
            git commit -m "chore(social): week $(date -u -d "${DATUM:-now}" +%G-W%V), $INGEPLAND post(s) ingepland in Buffer"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
